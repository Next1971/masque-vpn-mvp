name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-build:
    name: Server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"

      - name: Build server
        working-directory: android/go-src/masque-vpn
        run: go build -v ./...

      - name: Build Linux binaries
        working-directory: android/go-src/masque-vpn
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o vpn-server-linux-amd64 ./cmd/poc-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o vpn-server-linux-arm64 ./cmd/poc-server

      - uses: actions/upload-artifact@v7
        with:
          name: vpn-server-linux
          path: |
            android/go-src/masque-vpn/vpn-server-linux-amd64
            android/go-src/masque-vpn/vpn-server-linux-arm64

      - name: Vet
        working-directory: android/go-src/masque-vpn
        run: go vet ./...

      - name: Test core and mobile bridge
        working-directory: android/go-src/masque-vpn
        run: go test ./internal/clientcore ./mobile

  windows-build:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config

      - name: Fetch wintun.dll
        working-directory: windows
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-wintun.ps1

      - name: Embed EXE icons
        working-directory: windows
        run: |
          $ico = Join-Path (Get-Location) "installer\masque.ico"
          foreach ($pkg in @("cmd\vpn-gui", "cmd\vpn-setup", "cmd\vpn-service", "cmd\vpn-client")) {
            $manifest = if ($pkg -eq "cmd\vpn-gui") { "gui" } else { "cli" }
            Push-Location $pkg
            go run github.com/tc-hib/go-winres@latest simply --icon $ico --arch amd64 --manifest $manifest --product-name "MASQUE VPN" --file-description "MASQUE VPN" --product-version "1.5.0.0" --file-version "1.5.0.0"
            Pop-Location
          }

      - name: Build service and console client
        working-directory: windows
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist -Force | Out-Null
          go build -v -o dist/vpn-client.exe ./cmd/vpn-client
          go build -v -o dist/masque-svc.exe ./cmd/vpn-service

      - name: Build Fyne GUI
        working-directory: windows
        env:
          CGO_ENABLED: "1"
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          go build -v -ldflags "-H windowsgui" -o dist/masque-gui.exe ./cmd/vpn-gui
          go build -v -ldflags "-H windowsgui" -o dist/masque-setup.exe ./cmd/vpn-setup

      - name: Vet
        working-directory: windows
        env:
          CGO_ENABLED: "1"
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          go test ./internal/vpssetup
          go vet ./...

      - name: Install WiX
        run: dotnet tool install --global wix --version 7.0.0

      - name: Build MSI
        working-directory: windows
        # WiX v7 OSMF: https://wixtoolset.org/osmf/ (fee $0 under $10k revenue)
        run: wix build -acceptEula wix7 .\installer\masque.wxs -bindpath bin=dist -out dist\masque.msi -arch x64

  android-build:
    name: Android (AAR + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;29.0.13599879"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Ensure libs directory exists
        working-directory: android
        run: mkdir -p app/libs

      - name: Build AAR
        working-directory: android/go-src/masque-vpn
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13599879
        run: gomobile bind -target=android -androidapi 24 -o ../../app/libs/masque.aar ./mobile

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

  ios-build:
    name: iOS client
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"

      - name: Go tests (mobile bridge)
        working-directory: android/go-src/masque-vpn
        run: go test ./mobile ./internal/clientcore

      - name: Build Mobile.xcframework
        run: bash ios/scripts/build-xcframework.sh

      - name: Compile iOS app (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project Masque.xcodeproj -scheme Masque \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build
